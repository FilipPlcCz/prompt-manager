name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-core:
    name: Test core crates (Linux, offline-friendly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit & integration tests (pm-core, pm-api, pm-mcp)
        run: cargo test -p pm-core -p pm-api -p pm-mcp

  build-windows:
    name: Build Windows .exe (portable + NSIS installer)
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: win-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Run tests on Windows
        run: cargo test -p pm-core -p pm-api -p pm-mcp

      - name: Build MCP sidecar
        run: |
          cargo build -p pm-mcp --release
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/prompt-manager-mcp.exe src-tauri/binaries/prompt-manager-mcp-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app (release)
        run: tauri build
        working-directory: src-tauri

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/prompt-manager.exe out/PromptManager-portable.exe
          Copy-Item target/release/prompt-manager-mcp.exe out/prompt-manager-mcp.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_.FullName out/ }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-manager-windows
          path: out/*

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
